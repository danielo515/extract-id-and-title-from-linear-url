<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="100%" stop-color="#A55EEA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#g)" filter="url(#shadow)"/>

  <!-- Stylized link + ID/Title motif -->
  <g transform="translate(96, 128)">
    <!-- Link chain -->
    <g fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" opacity="0.9">
      <path d="M120 120c0-33.137 26.863-60 60-60h48c33.137 0 60 26.863 60 60s-26.863 60-60 60h-20"/>
      <path d="M120 120c0 33.137-26.863 60-60 60H12C-21.137 180-48 153.137-48 120S-21.137 60 12 60h20" transform="translate(168,0) scale(-1,1) translate(-168,0)"/>
    </g>

    <!-- ID and Title blocks -->
    <rect x="0" y="192" width="140" height="40" rx="12" fill="rgba(255,255,255,0.2)"/>
    <rect x="160" y="192" width="200" height="40" rx="12" fill="rgba(255,255,255,0.2)"/>

    <!-- Separator, defaults visually to a colon -->
    <circle cx="144" cy="206" r="4" fill="#FFFFFF"/>
    <circle cx="144" cy="218" r="4" fill="#FFFFFF"/>

    <!-- Label text -->
    <text x="12" y="219" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial" font-size="22" font-weight="700" fill="#FFFFFF" opacity="0.95">ID</text>
    <text x="172" y="219" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial" font-size="22" font-weight="600" fill="#FFFFFF" opacity="0.95">Title</text>
  </g>
</svg>
